worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    map $time_iso8601 $log_timestamp {
        ~^(?<timestamp_utc>[^+]+)\+ "$timestamp_utc";
    }
    map $msec $log_milliseconds {
        ~(?<millis_part>\.[0-9][0-9][0-9])$ "$millis_part";
    }
    log_format with_request_id '[$log_timestamp$log_milliseconds' 'Z] nginx [$http_x_cff_request_id] "$request" '
        '$status $body_bytes_sent "$http_referer" "$http_user_agent" ';
    access_log /dev/stdout with_request_id;

    client_body_temp_path /tmp/nginx/client_temp;
    fastcgi_temp_path /tmp/nginx/fastcgi_temp;
    proxy_temp_path /tmp/nginx/proxy_temp;
    uwsgi_temp_path /tmp/nginx/uwsgi_temp;
    scgi_temp_path /tmp/nginx/scgi_temp;

    server {
        listen 8000;
        server_name _;
        root /app/public;
        index index.php;

        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        location ~ \.php$ {
            try_files $uri =404;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_pass 127.0.0.1:9000;
        }

        location ~ /\.(?!well-known).* {
            deny all;
        }
    }
}
